[project]
name = "karaoke-phase0"
version = "0.3.0"
description = "Local karaoke song analysis and PySide6 song library"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2.0.2,<2.1.0",
  "scipy>=1.11,<2",
  "librosa>=0.10.2,<0.12",
  "soundfile>=0.12,<1",
  "matplotlib>=3.8,<4",
  "PySide6>=6.6,<7",
  "demucs==4.0.1",
  "whisperx==3.7.4",
  "torch==2.8.0",
  "torchaudio==2.8.0",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
required-version = ">=0.9,<0.14"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
